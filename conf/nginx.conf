location __PATH__ {
    proxy_pass http://127.0.0.1:__PORT____PATH__;
    include proxy_params_no_auth;
    allow      127.0.0.0/8;

    location ~ ^__PATH__/(.+\.(png|svg))$ {
        alias __DATA_DIR__/www/$1;
    }

    proxy_connect_timeout       600;
    proxy_send_timeout          600;
    proxy_read_timeout          600;
    send_timeout                600;
}
